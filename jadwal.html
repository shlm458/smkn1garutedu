<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal Pelajaran — EduSchool</title>
  <meta name="description" content="Jadwal pelajaran mingguan interaktif siswa dan agenda mengajar guru.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app-container">
    <aside class="app-sidebar" id="app-sidebar"></aside>

    <div class="app-main">
      <header class="app-topbar" id="app-topbar"></header>

      <main class="app-content">
        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; flex-wrap: wrap; gap: 14px;">
          <div>
            <h1 style="font-size: 1.8rem; margin-bottom: 4px;">Jadwal Pelajaran Mingguan</h1>
            <p style="font-size: 0.88rem; color: var(--text-muted);">
              Tahun Ajaran 2024/2025 • Semester Ganjil • Kelas X-Informatika 1
            </p>
          </div>
          <span class="badge badge-gold" id="today-day-indicator" style="font-size: 0.82rem; padding: 6px 14px;">
            Hari Ini
          </span>
        </div>

        <!-- Filter Hari (Senin s.d. Jumat) -->
        <div class="tab-nav" style="margin-bottom: 24px;">
          <button class="tab-btn tab-day-btn active" data-day="Semua" onclick="ScheduleManager.filterDay('Semua')">Semua Hari</button>
          <button class="tab-btn tab-day-btn" data-day="Senin" onclick="ScheduleManager.filterDay('Senin')">Senin</button>
          <button class="tab-btn tab-day-btn" data-day="Selasa" onclick="ScheduleManager.filterDay('Selasa')">Selasa</button>
          <button class="tab-btn tab-day-btn" data-day="Rabu" onclick="ScheduleManager.filterDay('Rabu')">Rabu</button>
          <button class="tab-btn tab-day-btn" data-day="Kamis" onclick="ScheduleManager.filterDay('Kamis')">Kamis</button>
          <button class="tab-btn tab-day-btn" data-day="Jumat" onclick="ScheduleManager.filterDay('Jumat')">Jumat</button>
        </div>

        <!-- Grid Jadwal -->
        <div id="schedules-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px;">
          <!-- Rendered via schedule.js -->
        </div>
      </main>

      <footer class="app-footer">
        <div>&copy; 2024 EduSchool — Sistem Agenda Akademik</div>
        <div class="app-footer-links">
          <a href="profil-sekolah.html">Profil Sekolah</a>
          <a href="materi.html">Materi</a>
          <a href="absensi.html">Absensi</a>
        </div>
      </footer>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/schedule.js"></script>
  <script>
    ScheduleManager.init();
  </script>
</body>
</html>
