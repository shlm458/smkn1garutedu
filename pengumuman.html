<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warta & Pengumuman — SMK Al-Madani Garut</title>
  <meta name="description" content="Pusat informasi dan pengumuman resmi sekolah untuk siswa dan pendidik.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app-container">
    <aside class="app-sidebar" id="app-sidebar"></aside>

    <div class="app-main">
      <header class="app-topbar" id="app-topbar"></header>

      <main class="app-content">
        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; flex-wrap: wrap; gap: 14px;">
          <div>
            <h1 style="font-size: 1.8rem; margin-bottom: 4px;">Warta & Pengumuman Resmi</h1>
            <p style="font-size: 0.88rem; color: var(--text-muted);">
              Informasi terkini mengenai kalender akademik, ujian, kompetisi, dan sarana sekolah.
            </p>
          </div>
          <div>
            <button class="btn btn-primary" id="btn-add-announcement" onclick="AnnouncementManager.openAddModal()" style="display: none;">
              📢 Terbitkan Pengumuman Baru
            </button>
          </div>
        </div>

        <!-- Filter Kategori Tabs -->
        <div class="tab-nav" style="margin-bottom: 24px;">
          <button class="tab-btn tab-announcement-btn active" data-category="all" onclick="AnnouncementManager.filterCategory('all')">Semua Kategori</button>
          <button class="tab-btn tab-announcement-btn" data-category="Akademik" onclick="AnnouncementManager.filterCategory('Akademik')">Akademik</button>
          <button class="tab-btn tab-announcement-btn" data-category="Kompetisi" onclick="AnnouncementManager.filterCategory('Kompetisi')">Kompetisi</button>
          <button class="tab-btn tab-announcement-btn" data-category="Fasilitas" onclick="AnnouncementManager.filterCategory('Fasilitas')">Fasilitas</button>
        </div>

        <!-- List Pengumuman -->
        <div id="announcements-list-container">
          <!-- Rendered via announcement.js -->
        </div>
      </main>

      <footer class="app-footer">
        <div>&copy; 2024 SMK Al-Madani Garut — Sistem Informasi Akademik</div>
        <div class="app-footer-links">
          <a href="profil-sekolah.html">Profil Sekolah</a>
          <a href="materi.html">Materi</a>
          <a href="jadwal.html">Jadwal</a>
        </div>
      </footer>
    </div>
  </div>

  <!-- Modal Terbitkan Pengumuman (Guru) -->
  <div class="modal-backdrop" id="modal-announcement-form">
    <div class="modal-dialog">
      <div class="modal-header">
        <div class="modal-title">Terbitkan Pengumuman Baru</div>
        <button class="modal-close" onclick="closeModal('modal-announcement-form')">✕</button>
      </div>
      <form onsubmit="AnnouncementManager.saveAnnouncementForm(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Judul Pengumuman <span class="required">*</span></label>
            <input type="text" id="form-anc-title" class="form-control" placeholder="Contoh: Jadwal Remedial Modul 04" required>
          </div>

          <div class="form-group">
            <label class="form-label">Kategori Informasi <span class="required">*</span></label>
            <select id="form-anc-category" class="form-control" required>
              <option value="Akademik">Akademik</option>
              <option value="Kompetisi">Kompetisi</option>
              <option value="Fasilitas">Fasilitas</option>
              <option value="Penting">Penting</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Isi Warta Pengumuman <span class="required">*</span></label>
            <textarea id="form-anc-content" class="form-control" rows="5" placeholder="Tuliskan isi pengumuman secara lengkap dan jelas..." required></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeModal('modal-announcement-form')">Batal</button>
          <button type="submit" class="btn btn-primary">Publikasikan Sekarang</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/announcement.js"></script>
  <script>
    AnnouncementManager.init();
  </script>
</body>
</html>
